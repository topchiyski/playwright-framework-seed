version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      playwright:
        patterns: ['@playwright/*']
      allure:
        patterns: ['allure', 'allure-*']
      lint-and-format:
        patterns: ['eslint', 'eslint-*', 'typescript-eslint', 'prettier']
    ignore:
      # typescript-eslint supports TypeScript < 6.1. Take TypeScript minors/majors only once it does
      # (check its peerDependencies), otherwise `npm run lint` breaks.
      - dependency-name: typescript
        update-types: ['version-update:semver-minor', 'version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
